plugins {
    id 'application'
    id 'java-conventions'
    id 'java-library'
    id "com.gorylenko.gradle-git-properties" version "${gradleGitCommitVersion}"
}

application {
    getMainClass().set('io.dingodb.mysql.MysqlInit')
}

dependencies {
    // implementation group: 'io.dingodb', name: 'dingo-sdk', version: project.version
    implementation ('io.dingodb:dingo-sdk:0.7.1-bw-SNAPSHOT') {
        exclude group: 'io.grpc', module: 'grpc-netty-shaded'
    }
    implementation group: 'io.grpc', name: 'grpc-core', version: 'grpc'.v()
    implementation group: 'io.grpc', name: 'grpc-netty-shaded', version: 'grpc'.v()
    implementation group: 'io.grpc', name: 'grpc-stub', version: 'grpc'.v()
    implementation group: 'io.grpc', name: 'grpc-protobuf', version: 'grpc'.v()

    implementation group: 'com.alibaba', name: 'fastjson', version: 'fastjson'.v()
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: 'slf4j'.v()
    implementation group:'com.google.protobuf', name:'protobuf-java', version: 'protobuf'.v()
    implementation project(":dingo-common")
}

task fatJar(type: Jar) {
    classifier 'all'
    from(
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) },
    )
    with jar

    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    eachFile { details ->
        if (details.path == 'META-INF/services/io.grpc.NameResolverProvider') {
            def content = details.file.text.replaceAll("io.grpc.netty.shaded.io.grpc.netty.UdsNameResolverProvider", "")
            details.file.text = content
        }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named("build") { x ->
    x.finalizedBy("fatJar")
}
