plugins {
    id 'application'
    id 'java-conventions'
    id 'java-library'
    id "com.gorylenko.gradle-git-properties" version "${gradleGitCommitVersion}"
    id "com.vanniktech.maven.publish"
}

application {
    applicationDefaultJvmArgs = ["--add-opens", "java.base/java.util=ALL-UNNAMED"]
}

dependencies {
    annotationProcessor group: 'com.google.auto.service', name: 'auto-service', version: 'auto-service'.v()
    compileOnly group: 'com.google.auto.service', name: 'auto-service', version: 'auto-service'.v()
    implementation group: 'org.apache.calcite.avatica', name: 'avatica-core', version: 'avatica'.v()
    implementation project(':dingo-common')
    implementation project(':dingo-net-api')
    implementation project(':dingo-net-netty')
    implementation project(':dingo-verify')
    implementation project(':dingo-calcite')
    implementation project(":dingo-driver:dingo-driver-common")
}

tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from javadoc
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('fatJar', Jar) {
    archiveClassifier.set('all')
    from(
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) },
    )
    with jar

    // Register dingo driver
    metaInf {
        from "src/main/resources/java.sql.Driver"
        into "services"
    }

    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    // Remove register of avatica driver
    exclude "META-INF/services/java.sql.Driver"
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

fatJar.dependsOn([
        ':dingo-common:jar',
        ':dingo-net-api:jar',
        ':dingo-net-netty:jar',
        ':dingo-serial:jar',
        ':dingo-verify:jar',
        ':dingo-calcite:jar',
        ":dingo-driver:dingo-driver-common:jar",
        ':dingo-cluster-api:jar',
        ':dingo-codec-api:jar',
        ':dingo-exec:jar',
        ':dingo-meta-api:jar',
        ':dingo-partition-api:jar',
        ':dingo-store-api:jar',
        ':dingo-tool-api:jar',
        ':dingo-transaction-api:jar',
        ':dingo-tso-api:jar'
])

tasks.named("build") { x ->
    x.finalizedBy("fatJar")
}

mavenPublishing {
    coordinates(project.property("GROUP"), "dingo-driver-client", project.property("VERSION") as String)
    
    pom {
        name = "dingo-driver-client" 
        description = "Driver client for DingoDB cluster"
        url= "https://www.dingodb.com/"
        
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        
        developers {
            developer {
                id = "dingodb"
                name = "DingoDB develop team"
                email = "dingodb@zetyun.com"
            }
        }
        
        scm {
            connection = "scm:git:git://github.com/dingodb/dingo.git"
            developerConnection = "scm:git:ssh://github.com/dingodb/dingo.git"
            url = "https://github.com/dingodb/dingo"
        }
    }
    
    publishToMavenCentral()
    signAllPublications()
}

project.gradle.taskGraph.whenReady { graph ->
    project.tasks.findAll().forEach { task ->
        if (task.name.contains("signArchives")) {
            task.enabled = false
        }
    }
}
