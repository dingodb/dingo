plugins {
    id 'java-conventions'
    id 'java-library'
    id "com.vanniktech.maven.publish"
}

dependencies {
    implementation project(':dingo-common')
}

tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from javadoc
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('fatJar', Jar) {
    from(
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) },
    )
    with jar

    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
}
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

fatJar.dependsOn([
    ':dingo-common:jar',
    ':dingo-serial:jar'
])

// Ensure that the fatJar is built before generating the Maven publication metadata
tasks.matching { it.name.contains("generateMetadataFileForMavenPublication") }.configureEach {
    dependsOn fatJar
}

tasks.named("build") { x ->
    x.finalizedBy("fatJar")
}

mavenPublishing {
    coordinates(project.property("GROUP"), "dingo-license-api", project.property("VERSION") as String)
    
    pom {
        name = "dingo-license-api" 
        description = "License API for DingoDB"
        url= "https://www.dingodb.com/"
        
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        
        developers {
            developer {
                id = "dingodb"
                name = "DingoDB develop team"
                email = "dingodb@zetyun.com"
            }
        }
        
        scm {
            connection = "scm:git:git://github.com/dingodb/dingo.git"
            developerConnection = "scm:git:ssh://github.com/dingodb/dingo.git"
            url = "https://github.com/dingodb/dingo"
        }
    }
    
    publishToMavenCentral()
    signAllPublications()
}


project.gradle.taskGraph.whenReady { graph ->
    project.tasks.findAll().forEach { task ->
        if (task.name.contains("signArchives")) {
            task.enabled = false
        }
    }
}
